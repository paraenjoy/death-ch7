<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>꺼진 것과 부서진 것</title>
<meta name="description" content="셸리 케이건 『죽음이란 무엇인가』 7장 죽음의 본질에 관하여 발표 자료">
<link rel="preload" href="fonts/ibm-plex-sans-kr-korean-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* layout: one fixed 1280x720 stage scaled to the window. diagram steps: display, readout strip, controls. sheet steps: one full card under the header */
@font-face{font-family:'IBM Plex Sans KR';font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-kr-korean-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans KR';font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-kr-korean-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans KR';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-kr-korean-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans KR';font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-kr-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'IBM Plex Sans KR';font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-kr-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'IBM Plex Sans KR';font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-kr-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
:root{
  color-scheme: light;
  --bg:#EEF1F4; --panel:#FFFFFF; --line:#D5DAE0; --ink:#14181D; --ink2:#3F4854; --mute:#6B7480;
  --rail:rgba(20,24,29,.18); --grid:rgba(20,24,29,.06);
  --b1:#FFB45A; --b2:#F08A1C; --p1:#7C8CFF; --p2:#3F51E0;
  --mon:#223040; --mon-ink:#F2F5F8; --mon-ink2:#A9B6C4; --led:#22C55E; --lamp:#4ADE80; --dead:#C6CBD3;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#fit{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;padding:20px 48px;display:flex;flex-direction:column;gap:12px;transform-origin:center center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
#head{height:46px;display:flex;align-items:center;justify-content:space-between;gap:24px}
#sec{font-size:13px;line-height:1.2;color:var(--ink2)}
#title{margin:2px 0 0;font-size:23px;line-height:1.25;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
#stepper{display:flex;align-items:center;gap:10px;flex:none}
.stepbtn{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center}
.stepbtn[aria-disabled="true"]{opacity:.35}
#count{font-size:15px;font-weight:500;min-width:72px;text-align:center}
#dl{margin-right:8px}
#dlmenu{position:fixed;margin:0;inset:auto;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);box-shadow:0 12px 32px rgba(40,55,90,.2);width:232px}
#dlmenu a,#dlmenu button{display:flex;align-items:center;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:8px;background:none;font-size:15px;font-weight:500;text-align:left;text-decoration:none;color:var(--ink)}
#dlmenu a:hover,#dlmenu button:hover{background:var(--bg)}
@supports not selector(:popover-open){#dlmenu{display:none}#dlmenu.open{display:block}}

/* main column */
#main{display:flex;flex-direction:column;gap:12px}
#main.hid{visibility:hidden}

/* display */
#display{position:relative;height:330px;border-radius:16px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
#display .abs{position:absolute}
#gridbg{left:168px;top:76px;width:968px;height:196px;background-image:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 24px)}
#legend{right:24px;top:13px;display:flex;align-items:center;gap:18px;font-size:14px;color:var(--ink2)}
#legend span{display:flex;align-items:center;gap:7px}
#legend i{display:block;width:30px;height:12px}
.stage-l{top:46px;text-align:center;font-size:15px;color:var(--ink2);white-space:nowrap}
.stage-l.on{font-weight:600;color:var(--ink)}
.bound{top:76px;width:1px;height:196px;background:var(--rail)}
.rail{left:168px;width:968px;height:1px;background:var(--rail)}
.tl{left:24px;line-height:1.25}
.tl b{display:block;font-size:17px;font-weight:600}
.tl small{font-size:14px;color:var(--ink2)}
.tube{position:absolute;height:26px}
.tube.lit.b{background:linear-gradient(180deg,var(--b1),var(--b2));box-shadow:0 0 0 1px rgba(240,138,28,.4),0 4px 16px rgba(240,138,28,.45)}
.tube.lit.p{background:linear-gradient(180deg,var(--p1),var(--p2));box-shadow:0 0 0 1px rgba(63,81,224,.4),0 4px 16px rgba(63,81,224,.45)}
.tube.lit.aid{background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.6) 0 5px,rgba(255,255,255,0) 5px 14px),linear-gradient(180deg,var(--b1),var(--b2));background-size:15.45px 100%,100% 100%;animation:pump 1.1s linear infinite,breathe 4s ease-in-out infinite}
@keyframes pump{to{background-position:15.45px 0,0 0}}
@keyframes breathe{0%,100%{opacity:.55}45%{opacity:1}}
.tube.off{background:#FFFFFF;border:1.5px solid var(--mute);border-radius:13px}
.tube.broken{background:var(--dead)}
.note{position:absolute;text-align:center;font-size:13px;color:var(--ink2);white-space:nowrap}
.lens{position:absolute;top:84px;height:180px;border-radius:16px;background:var(--lens-bg,rgba(63,81,224,.06));border:1.5px solid var(--lens-bd,rgba(63,81,224,.6));box-shadow:0 8px 24px rgba(40,55,90,.14),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:left .6s cubic-bezier(.3,.7,.2,1),width .6s cubic-bezier(.3,.7,.2,1),opacity .3s}
.lens em{position:absolute;left:12px;top:-12px;height:24px;padding:0 11px;border-radius:12px;display:flex;align-items:center;font-style:normal;font-size:13px;font-weight:600;white-space:nowrap;background:var(--lens-tab,var(--p2));color:var(--lens-tabfg,#FFFFFF)}
#scan{left:168px;top:78px;width:2px;height:214px;background:rgba(20,24,29,.7);opacity:0}
#scan i{position:absolute;right:2px;top:0;width:80px;height:214px;background:linear-gradient(90deg,rgba(20,24,29,0),rgba(20,24,29,.10));transition:opacity .5s}
.mark{top:274px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--mute);transition:color .3s}
.mark.on{color:var(--ink)}
#probe{top:302px;width:180px;margin-left:-90px;text-align:center;font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:13px;font-weight:500;color:var(--ink);transition:left .6s cubic-bezier(.3,.7,.2,1)}

/* readout strip: the one sentence each step says */
.readout{flex:none;min-height:64px;padding:8px 22px;border-radius:14px;display:flex;align-items:center;gap:18px;background-color:var(--mon);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,rgba(255,255,255,0) 1px 3px),linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 45%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 22px rgba(0,0,0,.35),0 6px 16px rgba(30,42,56,.25)}
.readout .tag{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--lamp);white-space:nowrap}
.readout .tag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--lamp);box-shadow:0 0 8px var(--lamp)}
.readout .sep{flex:none;width:1px;height:28px;background:rgba(255,255,255,.2)}
.readout p{margin:0;font-size:24px;line-height:1.3;font-weight:500;letter-spacing:-.01em;color:var(--mon-ink);word-break:keep-all;text-wrap:balance}
#caption{height:64px}
#captext.reveal{animation:reveal .45s ease-out}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* controls */
#lower{display:flex;gap:16px;height:204px}
#controls{flex:1;padding:14px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:150px 140px 150px minmax(0,1fr);gap:22px}
.col{transition:opacity .3s}
.col.dim{opacity:.32}
.lab{font-size:14px;font-weight:500;color:var(--ink2);margin:0 0 6px}
#casebox{height:150px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
#casetoc{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;border-radius:6px}
#caseno{font-size:24px;font-weight:500;line-height:1.1}
#caseno small{font-size:13px;font-weight:400;color:var(--ink2)}
#casename{font-size:16px;font-weight:600;line-height:1.3;word-break:keep-all;text-wrap:balance}
#again{align-self:flex-start;margin-top:2px;padding:1px 8px;border-radius:9px;background:var(--ink);color:#fff;font-size:12px;font-weight:500;white-space:nowrap}
#casenav{margin-top:auto;display:flex;gap:6px}
#casenav button{flex:1;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center}
.track{display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.track.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{height:44px;border:0;border-radius:9px;padding:0 12px;display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500;text-align:left;background:transparent;transition:background .25s,box-shadow .25s}
.track.two .opt{font-size:14px;padding:0 9px;gap:7px}
.opt i{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mute)}
.opt[aria-pressed="true"]{background:#FFFFFF;box-shadow:inset 0 0 0 2px var(--c),0 2px 5px rgba(20,24,29,.14)}
.opt[aria-pressed="true"] i{background:var(--c);border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 0 9px var(--c)}
#meansrow{display:flex;align-items:center;gap:14px}
#knob{flex:none;width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#FFFFFF,#DDE2E8);border:1px solid var(--line);box-shadow:0 4px 10px rgba(20,24,29,.14);display:flex;justify-content:center;transition:transform .4s cubic-bezier(.3,.7,.2,1)}
#knob i{width:4px;height:24px;margin-top:7px;border-radius:2px;background:var(--ink)}
#meanshint{font-size:13px;color:var(--ink2);margin:10px 0 0}
#verdict{width:328px;padding:14px 20px;border-radius:16px;color:var(--ink);background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(226,232,246,.92));box-shadow:0 0 0 1px var(--line),0 10px 26px rgba(40,55,90,.16),inset 0 2px 0 #FFFFFF,inset 0 -14px 22px rgba(150,168,205,.2)}
#vhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:14px;color:var(--ink2)}
#vhead .live{display:flex;align-items:center;gap:8px;font-weight:500}
#vhead .live i{width:8px;height:8px;border-radius:50%;background:var(--led)}
#intu{font-size:13px;font-weight:600}
#intu.ok{color:#15803D} #intu.bad{color:#C2410C}
.vrow{height:36px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(20,24,29,.12);font-size:16px}
.vrow .ans{display:flex;align-items:center;gap:10px;min-width:84px;font-family:var(--mono);font-weight:500}
.vrow .ans i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mute);transition:background .3s}
.vrow.yes .ans i{background:var(--led);border-color:#15803D;box-shadow:0 0 0 3px rgba(34,197,94,.22),0 0 9px rgba(34,197,94,.85)}

/* sheets: full cards for cover, contents, discussion, vote, who decides, questions */
#sheet{position:absolute;left:48px;right:48px;top:78px;bottom:20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:none;overflow:hidden}
#sheet.show{display:block}
.sh{position:absolute;inset:0;padding:26px 40px 28px;display:flex;flex-direction:column}
.sh h2{margin:0;font-weight:600;letter-spacing:-.02em;word-break:keep-all;text-wrap:balance}
.mt{position:absolute;height:14px}
.mt.b{background:linear-gradient(180deg,var(--b1),var(--b2))}
.mt.p{background:linear-gradient(180deg,var(--p1),var(--p2))}
.mt.off{background:#fff;border:1.5px solid var(--mute);border-radius:7px}
.mt.dead{background:var(--dead)}
.mt.aid{background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.65) 0 4px,rgba(255,255,255,0) 4px 10px),linear-gradient(180deg,var(--b1),var(--b2))}

/* cover */
.cover{padding:44px 56px 34px}
.cover .kicker{margin:0;font-size:18px;color:var(--ink2)}
.cstrip{position:relative;height:82px;margin-top:64px}
.clab{position:absolute;top:0;font-size:15px;color:var(--ink2);white-space:nowrap}
.cover .cwords{position:relative;height:100px;margin-top:22px}
.cover .cwords span{position:absolute;top:0;font-size:78px;line-height:100px;white-space:nowrap}
.cover .readout{margin-top:44px}
.cover .readout p{font-size:28px}
.cover .by{margin:auto 0 0;font-size:16px;color:var(--ink2)}

/* contents */
.toc2 h2{font-size:28px}
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:16px}
.groups span{font-size:15px;color:var(--ink2);padding-bottom:7px;border-bottom:2px solid var(--ink)}
.groups span:first-child{grid-column:span 3}
.groups span:last-child{border-color:var(--p2);color:var(--p2);font-weight:500}
.stations{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:14px}
.st{display:flex;flex-direction:column;padding:14px 16px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:left}
.st:hover,.chip:hover{border-color:var(--ink2)}
.thumb{position:relative;display:block;height:124px;border-radius:10px;background:#fff;border:1px solid var(--line);overflow:hidden}
.thumb svg{position:absolute}
.thumb .mt{height:18px}
.st .no{margin-top:14px;font-size:16px;color:var(--ink2)}
.st .name{margin-top:2px;font-size:23px;line-height:1.3;font-weight:600;word-break:keep-all;text-wrap:balance}
.st .gist{margin-top:8px;font-size:16px;line-height:1.45;color:var(--ink2);word-break:keep-all}
.st .pg{margin-top:auto;font-family:var(--mono);font-size:14px;color:var(--ink2)}
.tocfoot{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;margin-top:20px;align-items:end}
.tocfoot h3{margin:0 0 8px;font-size:14px;font-weight:500;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:34px;padding:4px 12px;border-radius:17px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:500;white-space:nowrap}
.chip small{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-right:6px}
.endbtn{min-height:76px;padding:10px 16px;border-radius:14px;border:1px solid var(--ink);background:var(--ink);color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.endbtn b{font-size:20px;font-weight:600}
.endbtn small{font-family:var(--mono);font-size:13px;color:var(--mon-ink2)}

/* discussion 1 */
.ask .body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:center}
.ask .tagline{margin:0 0 10px;font-size:17px;color:var(--ink2)}
.ask h2{font-size:46px;line-height:1.25}
.ask .sub{margin:22px 0 0;font-size:24px;line-height:1.5;color:var(--ink2);word-break:keep-all}
.fig{position:relative;height:284px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.fig .mt{height:24px}
.fig span{position:absolute;font-size:15px;color:var(--ink2);white-space:nowrap}
.fig .band{position:absolute;border:1.5px dashed var(--ink);border-radius:12px}
.fig svg{position:absolute}

/* vote */
.vote2 .body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:52px;align-items:center}
.vote2 .tagline{margin:0 0 10px;font-size:19px;color:var(--ink2)}
.vote2 h2{font-size:56px;line-height:1.2}
.vrows{display:grid;grid-template-columns:auto minmax(0,1fr) 124px;gap:20px 20px;align-items:center;margin-top:36px}
.vname{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:600;white-space:nowrap}
.sw{flex:none;width:52px;height:26px}
.sw.dead{background:#9AA3AE}
.sw.alive{border-radius:13px;background:linear-gradient(180deg,#86EFAC,var(--led));box-shadow:0 0 0 1px rgba(34,197,94,.45),0 3px 10px rgba(34,197,94,.4)}
.sw.none{border-radius:13px;border:1.5px solid var(--mute);background:repeating-linear-gradient(115deg,#fff 0 5px,#CBD2DA 5px 8px)}
.vtrack{height:40px;border-radius:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.vfill{height:100%;transform-origin:left center;transform:scaleX(0);transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.vfill.dead{background:#9AA3AE}
.vfill.alive{background:linear-gradient(180deg,#86EFAC,var(--led))}
.vfill.none{background:repeating-linear-gradient(115deg,#fff 0 5px,#AEB7C2 5px 9px)}
.vnum{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;text-align:right;white-space:nowrap}
.vnum small{font-size:14px;color:var(--ink2);margin-left:6px}
.vfoot{display:flex;align-items:center;gap:16px;margin-top:34px;font-size:18px;color:var(--ink2)}
#reveal{min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:16px;font-weight:500}
.qrcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 18px 18px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:center}
#qrbox{width:264px;height:264px;border-radius:10px;background:#fff;border:1px solid var(--line);overflow:hidden}
#qrbox svg{display:block;width:100%;height:100%}
.qrcard b{font-family:var(--mono);font-size:18px;font-weight:500;white-space:nowrap}
.qrcard small{font-size:16px;color:var(--ink2)}

/* who decides */
.bd{position:relative;height:116px;margin-top:22px}
.bd .tube{top:26px;height:38px}
.bd .tube.off{border-radius:19px}
.bd .lbl{position:absolute;top:0;font-size:15px;color:var(--ink2);white-space:nowrap}
.bd .marker{position:absolute;left:645px;top:18px;width:4px;height:98px;border-radius:2px;background:var(--ink)}
.bd .mtag{position:absolute;left:657px;top:74px;padding:1px 9px;border-radius:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:500;white-space:nowrap}
.bd .bus{position:absolute;left:132px;right:132px;bottom:0;height:1.5px;background:var(--ink)}
.bd svg{position:absolute;left:619px;top:-4px}
.mods{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:22px}
.mod{position:relative;padding:14px 16px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column}
.mod::before{content:'';position:absolute;left:calc(50% - .75px);top:-23px;width:1.5px;height:23px;background:var(--ink)}
.mod .n{font-family:var(--mono);font-size:14px;color:var(--ink2)}
.mod h3{margin:0;font-size:26px;line-height:1.25;font-weight:600}
.mod .dec{margin:3px 0 0;font-size:18px;color:var(--ink2);word-break:keep-all}
.viz{position:relative;height:96px;margin-top:18px;border-radius:10px;background:#fff;border:1px solid var(--line)}

.viz .seg b{font-weight:500;color:var(--ink)}
.viz .seg i{height:26px;margin-left:4px;border-radius:7px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-style:normal;color:var(--ink)}
.mod .mnote{margin:auto 0 0;padding-top:12px;font-size:17px;line-height:1.45;font-weight:500;word-break:keep-all;text-wrap:balance}

/* questions */
.qgrid{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.q{display:grid;grid-template-columns:70px minmax(0,1fr);column-gap:16px;align-content:center;padding:18px 26px 20px 22px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.q .num{grid-row:span 2;align-self:center;font-size:72px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.q .key{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink2)}
.q .key i{flex:none;display:block;width:40px;height:16px}
.q p{margin:8px 0 0;font-size:23px;line-height:1.42;font-weight:500;word-break:keep-all;text-wrap:balance}
.ic-knob{border-radius:8px;background:linear-gradient(145deg,#fff,#DDE2E8);border:1px solid var(--mute);position:relative}
.ic-knob::after{content:'';position:absolute;left:24px;top:2px;width:3px;height:10px;border-radius:2px;background:var(--ink)}
.ic-sw{border-radius:8px;border:1.5px solid var(--mute);background:linear-gradient(90deg,var(--ink) 0 50%,#fff 50% 100%)}
.ic-dead{background:var(--dead)}
.ic-off{border-radius:8px;border:1.5px solid var(--mute);background:#fff}

/* dialogs and notes outside the stage */
dialog{border:1px solid var(--line);border-radius:14px;padding:22px 24px;width:min(340px,calc(100vw - 32px));color:var(--ink);font-family:var(--sans)}
dialog,dialog::backdrop{overscroll-behavior:contain}
dialog::backdrop{background:rgba(16,21,27,.5)}
dialog h2{margin:0 0 6px;font-size:20px}
dialog p{margin:0 0 14px;font-size:15px;color:var(--ink2)}
dialog label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
dialog input{width:100%;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--mute);font:inherit;font-size:18px}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
dialog .row button{min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500}
dialog .row button[value="ok"]{background:var(--ink);border-color:var(--ink);color:#fff}
#pinerr{min-height:20px;margin:8px 0 0;color:#B42318;font-size:14px}
#rot{display:none;position:fixed;left:12px;right:12px;bottom:12px;padding:10px 14px;border-radius:10px;background:var(--mon);color:var(--mon-ink);font-size:14px;text-align:center}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
#print{display:none}
body.static *,#print *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{

function tubeHTML(list,kind,y){
  var h='';
  list.forEach(function(s,i){
    var prev=list[i-1],nx=list[i+1],w=s.b-s.a;
    if(s.s==='on'){
      var rl=(prev&&prev.s==='on')?0:13, rr=(!nx||nx.s==='off')?13:0;
      if(prev&&prev.s==='lost')rl=0;
      h+='<div class="tube lit '+kind+(s.aid?' aid':'')+'" style="left:'+s.a+'px;top:'+y+'px;width:'+w+'px;border-radius:'+rl+'px '+rr+'px '+rr+'px '+rl+'px"></div>';
    }else if(s.s==='off'){
      h+='<div class="tube off" style="left:'+(s.a+3)+'px;top:'+y+'px;width:'+(w-6)+'px"></div>';
    }else if(s.s==='lost'){
      var gp=(prev&&prev.s==='lost')?0:3;
      h+='<div class="tube broken" style="left:'+(s.a+gp)+'px;top:'+y+'px;width:'+(w-gp)+'px"></div>';
    }
    if(s.note)h+='<span class="note" style="left:'+s.a+'px;width:'+w+'px;top:'+(y+34)+'px">'+s.note+'</span>';
  });
  return h;
}

  c.marks.forEach(function(m){h+='<span class="abs mark" data-view="'+(m[2]||'')+'" style="left:'+(m[0]-8)+'px">★ '+m[1]+'</span>';});
  $('marks').innerHTML=h;
  $('caseno').innerHTML=pad(st.c+1)+' <small>/ '+pad(CASES.length)+'</small>';
  $('casename').textContent=c.name;
}
function probeX(){var c=CASES[st.c];return c.probes[st.probe]||c.probes.main;}
function runScan(done){
  var tok=++scanTok,el=$('scan'),dx=probeX()-X0;
  var reduce=STATIC||(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  if(reduce||!el.animate){el.getAnimations&&el.getAnimations().forEach(function(a){a.cancel();});el.style.opacity=1;el.firstElementChild.style.opacity=0;el.style.transform='translateX('+dx+'px)';done();return;}
  el.style.opacity=1;el.firstElementChild.style.opacity=1;
  el.animate([{transform:'translateX(0)',opacity:0},{transform:'translateX('+(dx*0.12)+'px)',opacity:1,offset:.12},{transform:'translateX('+dx+'px)',opacity:1}],{duration:900,easing:'cubic-bezier(.45,0,.2,1)',fill:'forwards'});
  setTimeout(function(){if(tok===scanTok){el.firstElementChild.style.opacity=0;done();}},900);
}
function genCap(v){
  var c=CASES[st.c];
  if(!v)return c.name+': 관점을 고르면 판정이 나온다.';
  var who=st.view==='person'?'인격 관점':'육체 관점';
  var dn={stop:'멈춤',permanent:'영구 멈춤',capacity:'능력 상실'}[st.def];
  return who+' · '+dn+' 기준: 나는 '+(v[1]?'살아 있다':'살아 있지 않다')+'.';
}
function paintVerdict(v,pending){
  var rows=ROOT.querySelectorAll('#verdict .vrow');
  for(var i=0;i<rows.length;i++){
    var yes=!!(v&&v[i])&&!pending;
    rows[i].classList.toggle('yes',yes);
    rows[i].querySelector('b').textContent=pending?'···':(v?(v[i]?'예':'아니오'):'—');
  }
  var it=$('intu'),c=CASES[st.c];it.textContent='';it.className='';
  if(!pending&&v&&st.intu&&typeof c.intuition==='boolean'&&st.view==='person'){
    var ok=(v[1]===c.intuition);
    it.textContent=ok?'○ 직관과 맞음':'× 직관과 어긋남';it.className=ok?'ok':'bad';
  }
  $('basis').textContent=st.view?(st.view==='person'?'인격 관점':'육체 관점'):'';
}
function showSheet(k){
  if(k===sheetKey)return;
  sheetKey=k;
  var sh=$('sheet');
  sh.innerHTML=k?SHEETS[k]():'';
  sh.classList.toggle('show',!!k);
  $('main').inert=!!k;$('main').classList.toggle('hid',!!k);
  if(k==='vote'){drawQR();paintVote();voteStart();}else voteStop();
}
function render(){
  var step=STEPS[idx],c=CASES[st.c],key=st.c+'|'+st.probe;
  var rescan=(key!==lastKey);
  if(rescan){drawCase();lastKey=key;}
  $('sec').textContent=step.sec;$('title').textContent=step.title;
  $('count').textContent=pad(idx+1)+' / '+STEPS.length;
  $('prev').setAttribute('aria-disabled',idx===0);$('next').setAttribute('aria-disabled',idx===STEPS.length-1);
  showSheet(tocOpen?'toc':(!manual&&step.sheet?step.sheet:null));
  var opts=ROOT.querySelectorAll('.opt');
  for(var i=0;i<opts.length;i++){var o=opts[i];o.setAttribute('aria-pressed',String(st[o.dataset.k])===o.dataset.v);}
  var cols=ROOT.querySelectorAll('.col');
  for(i=0;i<cols.length;i++)cols[i].classList.toggle('dim',!manual&&Number(cols[i].dataset.level)>st.level);
  if(st.def!=='capacity')$('meanscol').classList.add('dim');
  $('again').hidden=!(st.again&&!manual);
  var L=$('lenses').style,bodyV=st.view==='body';
  L.setProperty('--lens-bg',bodyV?'rgba(240,138,28,.07)':'rgba(63,81,224,.06)');L.setProperty('--lens-bd',bodyV?'rgba(200,105,10,.75)':'rgba(63,81,224,.6)');
  L.setProperty('--lens-tab',bodyV?'#F08A1C':'#3F51E0');L.setProperty('--lens-tabfg',bodyV?'#14181D':'#FFFFFF');
  $('knob').style.transform='rotate('+[-60,-20,20,60][st.means]+'deg)';
  var rs=lensRanges(st),ls=ROOT.querySelectorAll('.lens');
  for(i=0;i<ls.length;i++){
    var r=rs[i];
    if(r){ls[i].style.left=(r[0]-8)+'px';ls[i].style.width=(r[1]-r[0]+16)+'px';ls[i].style.opacity=1;}
    else{ls[i].style.opacity=0;}
  }
  ls[0].querySelector('em').textContent=st.view==='body'?'나 · 육체 관점':'나 · 인격 관점';
  var px=probeX(),sl=ROOT.querySelectorAll('.stage-l');
  for(i=0;i<sl.length;i++)sl[i].classList.toggle('on',px>=Number(sl[i].dataset.a)&&px<Number(sl[i].dataset.b));
  var mk=ROOT.querySelectorAll('.mark');
  for(i=0;i<mk.length;i++){var mv=mk[i].dataset.view;mk[i].classList.toggle('on',!mv||!st.view||mv===st.view);}
  $('probe').style.left=px+'px';
  $('probe').textContent='▲ 판정 시점'+(c.probeLabel?' '+c.probeLabel:'');
  var v=verdict(st);
  var ct=$('captext'),txt=manual?genCap(v):step.cap;
  $('captag').textContent=manual?'자유 조작':'판독';
  if(ct.textContent!==txt){
    ct.textContent=txt;ct.style.fontSize='24px';
    var fs=24;while(ct.scrollHeight>52&&fs>17){fs-=1;ct.style.fontSize=fs+'px';}
    ct.classList.remove('reveal');
    if(!STATIC){void ct.offsetWidth;ct.classList.add('reveal');}
  }
  if(rescan){paintVerdict(v,true);runScan(function(){paintVerdict(verdict(st),false);});}
  else paintVerdict(v,false);
}
function go(n){
  n=Math.max(0,Math.min(STEPS.length-1,n));
  idx=n;manual=false;tocOpen=false;
  var s=STEPS[n];st={c:s.c,view:s.view,def:s.def,means:s.means,probe:s.probe,level:s.level,intu:s.intu,again:s.again};
  render();
}
function setCtl(k,v){
  manual=true;
  if(k==='means'){st.means=Number(v);st.def='capacity';}else st[k]=v;
  st.level=4;st.intu=true;render();
}
function freeCase(i){manual=true;tocOpen=false;st.c=(i+CASES.length)%CASES.length;st.probe='main';st.level=4;st.intu=true;render();}

/* ---------- vote ---------- */
var V={counts:null,reveal:false,timer:null,err:false};
function rpc(fn,body){
  return fetch(API+fn,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}
function paintVote(){
  var box=ROOT.querySelector('.vote2');if(!box)return;
  var c=V.counts||[0,0,0],tot=c[0]+c[1]+c[2];
  var fills=box.querySelectorAll('.vfill'),nums=box.querySelectorAll('.vnum');
  for(var i=0;i<3;i++){
    var share=tot?c[i]/tot:0;
    fills[i].style.transform='scaleX('+(V.reveal?share:0)+')';
    nums[i].innerHTML=V.reveal?(c[i]+'표<small>'+Math.round(share*100)+'%</small>'):'–';
  }
  $('reveal').textContent=V.reveal?'결과 숨기기':'결과 공개';
  $('vstat').textContent=STATIC?'':V.err?'집계 서버에 연결하지 못했다. 손을 들어 답을 모은다.':(V.counts?('지금까지 '+tot+'명 참여'):'집계를 불러오는 중');
}
function pollVote(){
  if(STATIC||document.hidden)return;
  rpc('vote_counts').then(function(c){V.counts=c;V.err=false;paintVote();}).catch(function(){V.err=true;paintVote();});
}
function voteStart(){if(V.timer||STATIC)return;pollVote();V.timer=setInterval(pollVote,2500);}
function voteStop(){if(V.timer){clearInterval(V.timer);V.timer=null;}}
function drawQR(){
  var box=$('qrbox');if(!box||!window.qrcode)return;
  var q=window.qrcode(0,'M');q.addData(VOTE_URL);q.make();
  var n=q.getModuleCount(),d='';
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))d+='M'+k+' '+r+'h1v1h-1z';
  box.innerHTML='<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" role="img" aria-label="투표 페이지로 가는 QR 코드" shape-rendering="crispEdges"><path d="'+d+'" fill="#14181D"/></svg>';
}
var dlg=$('resetdlg');
dlg.addEventListener('close',function(){
  if(dlg.returnValue!=='ok')return;
  var pin=$('pin').value;$('pin').value='';
  rpc('reset_votes',{p_pin:pin}).then(function(ok){
    if(ok){V.counts=[0,0,0];V.reveal=false;$('pinerr').textContent='';paintVote();}
    else{$('pinerr').textContent='PIN이 맞지 않는다. 다시 입력한다.';dlg.showModal();}
  }).catch(function(){$('pinerr').textContent='서버에 연결하지 못했다. 잠시 뒤 다시 시도한다.';dlg.showModal();});
});

/* ---------- download and print ---------- */
function buildPrint(){
  var keep=idx,wrap=$('print');
  STATIC=true;document.body.classList.add('static');wrap.innerHTML='';
  for(var i=0;i<STEPS.length;i++){go(i);var cl=$('stage').cloneNode(true);cl.style.transform='none';wrap.appendChild(cl);}
  go(keep);STATIC=false;document.body.classList.remove('static');fit();
}
window.addEventListener('beforeprint',buildPrint);
window.addEventListener('afterprint',function(){$('print').innerHTML='';});
var menu=$('dlmenu'),dlb=$('dl'),hasPop=('popover' in HTMLElement.prototype);
function placeMenu(){var r=dlb.getBoundingClientRect();menu.style.top=(r.bottom+8)+'px';menu.style.left=Math.max(8,Math.min(window.innerWidth-240,r.right-232))+'px';}
if(hasPop)menu.addEventListener('beforetoggle',placeMenu);
else dlb.addEventListener('click',function(){placeMenu();menu.classList.toggle('open');});
function closeMenu(){if(hasPop){try{menu.hidePopover();}catch(e){}}else menu.classList.remove('open');}
$('dlpdf').addEventListener('click',closeMenu);
$('dlhtml').addEventListener('click',function(){
  closeMenu();
  fetch(location.href.split('#')[0]).then(function(r){return r.text();}).then(function(t){
    t=t.replace(/(["'(])(fonts|js)\//g,'$1'+SITE+'/$2/').replace('href="deck.pdf"','href="'+SITE+'/deck.pdf"');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='꺼진 것과 부서진 것.html';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  }).catch(function(){location.href=location.href.split('#')[0];});
});

/* ---------- events ---------- */
$('next').addEventListener('click',function(){go(idx+1);});
$('prev').addEventListener('click',function(){go(idx-1);});
$('casenext').addEventListener('click',function(){freeCase(st.c+1);});
$('caseprev').addEventListener('click',function(){freeCase(st.c-1);});
$('casetoc').addEventListener('click',function(){tocOpen=!tocOpen;render();});
$('sheet').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.go!==undefined)go(Number(b.dataset.go));
  else if(b.dataset['case']!==undefined)freeCase(Number(b.dataset['case']));
  else if(b.id==='reveal'){V.reveal=!V.reveal;paintVote();}
});
$('controls').addEventListener('click',function(e){var b=e.target.closest('.opt');if(b)setCtl(b.dataset.k,b.dataset.v);});
var SECSTART={'1':2,'2':7,'3':9,'4':20};
document.addEventListener('keydown',function(e){
  if(e.isComposing||e.keyCode===229)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.closest&&e.target.closest('input,dialog,#dlmenu'))return;
  var k=e.key;
  if(sheetKey==='vote'&&k==='Enter'){e.preventDefault();V.reveal=!V.reveal;paintVote();}
  else if(sheetKey==='vote'&&e.shiftKey&&(k==='R'||k==='r')){e.preventDefault();$('pinerr').textContent='';dlg.showModal();}
  else if(k==='ArrowRight'||k==='PageDown'||k===' '){e.preventDefault();if(manual||tocOpen)go(idx);else go(idx+1);}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();if(manual||tocOpen)go(idx);else go(idx-1);}
  else if(k==='m'||k==='M'){tocOpen=!tocOpen;render();}
  else if(k==='Escape'&&tocOpen){tocOpen=false;render();}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(STEPS.length-1);}
  else if(SECSTART[k]!==undefined){go(SECSTART[k]);}
  else if(k==='f'||k==='F'){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){});}catch(err){}}
});
var tx=null;
document.addEventListener('touchstart',function(e){tx=e.touches.length===1?e.touches[0].clientX:null;},{passive:true});
document.addEventListener('touchend',function(e){
  if(tx===null||(e.target.closest&&e.target.closest('dialog,#dlmenu')))return;
  var dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)>60)go(idx+(dx<0?1:-1));
},{passive:true});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&sheetKey==='vote')pollVote();});
function fit(){var s=Math.min(window.innerWidth/1280,window.innerHeight/720);$('stage').style.transform='scale('+s+')';}
window.addEventListener('resize',fit);
window.__deck={go:go,count:STEPS.length,buildPrint:buildPrint,setStatic:function(v){STATIC=v;document.body.classList.toggle('static',v);}};
fit();go(0);
})();
</script>
</body>
